---
# Primary CI (Forgejo Actions). The .github/workflows/ci.yml mirror
# carries the GitHub-only extras (codecov, SARIF uploads, labeler).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up mise (go, just, golangci-lint)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run golangci-lint
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up mise (go, just)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run unit tests
        run: just test-coverage

      - name: Coverage gate (per-package floor)
        run: just coverage-gate
